name: Android debug APK

on:
  push:
    branches: [main, feat/english-gc-tune]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify all app text is English
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          files = list(pathlib.Path("app/src/main").rglob("*.java")) + list(pathlib.Path("app/src/main").rglob("*.xml"))
          bad = [(str(f), i, line.strip()[:120]) for f in files
                 for i, line in enumerate(f.read_text(encoding="utf-8").splitlines(), 1)
                 if re.search("[\u0400-\u04FF]", line)]
          for f, i, line in bad: print(f"{f}:{i}: {line}")
          if bad: sys.exit(f"Found {len(bad)} untranslated line(s)")
          print("All app sources are free of Cyrillic text.")
          PY
      - name: Build debug APKs
        run: gradle :app:assembleDebug :overlay_m3:assembleDebug --no-daemon --stacktrace
      - name: Upload Vivix APK
        uses: actions/upload-artifact@v4
        with:
          name: Vivix-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload Material 3 overlay APK
        uses: actions/upload-artifact@v4
        with:
          name: Vivix-M3-overlay-debug-apk
          path: overlay_m3/build/outputs/apk/debug/*.apk
          if-no-files-found: error
